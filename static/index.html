<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>yt-dlp-web</title>
        <link rel="stylesheet" href="index.css" />
    </head>

    <body>
        <div class="container">
            <span class="title">yt-dlp-web</span>
            <form id="downloadForm">
                <input
                    type="url"
                    placeholder="Paste URL here..."
                    id="url-input"
                    required
                />
                <label for="mediaType" class="text">Media Type:</label>
                <select name="mediaType" id="mediaType">
                    <option value="Video">Video</option>
                    <option value="Audio">Audio</option>
                </select>
                <button type="submit" id="download-button">Download</button>
            </form>
            <div id="manifest-container" class="text">
                <p>Downloaded the following videos:</p>
                <ul id="manifest-list"></ul>
            </div>
            <div id="done-message" class="text">
                <p>Download complete.</p>
            </div>
            <div id="error-message" class="text">
                <p>
                    There was an error downloading one or more of your videos :(
                </p>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
