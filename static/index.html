<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>yt-dlp-web</title>
        <link rel="stylesheet" href="index.css" />
    </head>

    <body>
        <div class="container">
            <div>
                <span class="title">yt-dlp-web</span>
            </div>
            <form id="downloadForm">
                <div>
                    <input
                        type="url"
                        placeholder="Paste URL here..."
                        id="urlInput"
                        required
                    />
                </div>
                <div>
                    <button type="submit">Download</button>
                </div>
            </form>
            <div id="manifest" class="text">
                <p>Downloaded the following videos:</p>
                <ul id="manifest-list"></ul>
            </div>
            <div id="done-message" class="text">
                <p>Download complete.</p>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
